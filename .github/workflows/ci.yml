name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  dotnet:
    name: .NET (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet build EdgeForge.sln -c Release
      - run: dotnet test EdgeForge.sln -c Release --no-build
      - name: End-to-end run on the synthetic belt
        shell: bash
        env:
          EDGEFORGE_PROFILE: eggs
        run: |
          dotnet run --no-build -c Release --project src/EdgeForge.Demo -- samples/eggs.mp4 | tee run.log
          grep -E 'Items judged +: 30' run.log
          grep -E 'OK / NOK / \? +: 23 / 7 / 0' run.log

  web:
    name: Web build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
